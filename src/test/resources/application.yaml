spring:
  application:
    name: pro24_group4_test

  datasource:
    url: ${DB_TEST_URL:jdbc:postgresql://localhost:5432/pro24_group4_test}
    username: ${DB_TEST_USER:postgres}
    password: ${DB_TEST_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    liquibase: WARN

jwt:
  secret: ${JWT_TEST_SECRET}
  expiration: 86400000

app:
  seed:
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    dara-password: ${APP_SEED_DARA_PASSWORD:}
